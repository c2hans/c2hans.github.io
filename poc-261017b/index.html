<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>
<h1>Application Login</h1>
<div id="login-form">
  <form id="loginForm" onsubmit="return doLogin(event)">
    <label>Username: <input type="text" name="username" id="username"></label><br><br>
    <label>Password: <input type="password" name="password" id="password"></label><br><br>
    <button type="submit">Sign In</button>
  </form>
  <p id="error" style="color:red;display:none">Invalid credentials</p>
</div>
<div id="dashboard" style="display:none">
  <h2>Welcome back!</h2>
  <p>You are now logged in. Session active.</p>
  <p>Dashboard loading...</p>
</div>
<script>
function doLogin(e) {
  e.preventDefault();
  var u = document.getElementById('username').value;
  var p = document.getElementById('password').value;
  if (u && p) {
    document.cookie = "session=authenticated; path=/; max-age=3600; SameSite=Lax";
    document.cookie = "user=" + encodeURIComponent(u) + "; path=/; max-age=3600; SameSite=Lax";
    localStorage.setItem('authToken', 'sess-' + Date.now());
    localStorage.setItem('user', u);
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.title = 'Dashboard - Logged In';
  } else {
    document.getElementById('error').style.display = 'block';
  }
  return false;
}
if (document.cookie.indexOf('session=authenticated') !== -1) {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.title = 'Dashboard - Logged In';
}
</script>
</body>
</html>
