<!DOCTYPE html>
<html><head><title>Dashboard - VH SecTest</title></head>
<body>
<h1>Dashboard</h1>
<div id="auth-check"></div>
<p>Account overview and statistics</p>
<ul>
<li>Active sessions: 3</li>
<li>API calls today: 142</li>
<li>Storage used: 2.3 GB</li>
</ul>
<nav><a href="/vh-sectest/">Home</a> | <a href="/vh-sectest/profile/">Profile</a> | <a href="/vh-sectest/settings/">Settings</a></nav>
<script>
var sess = document.cookie.match(/session=([^;]+)/);
if (!sess) { document.getElementById("auth-check").innerHTML = "<p style=\"color:red\">Not authenticated. <a href=\"/vh-sectest/\">Login</a></p>"; }
else { document.getElementById("auth-check").innerHTML = "<p>Logged in as: " + (document.cookie.match(/user=([^;]+)/)||["","unknown"])[1] + "</p>"; }
</script>
</body></html>
