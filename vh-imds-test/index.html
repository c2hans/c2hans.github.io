<!DOCTYPE html>
<html>
<head><title>VH Test App - Dashboard</title></head>
<body>
<h1>Welcome! You are logged in.</h1>
<p>Session active.</p>

<!-- Test: meta refresh redirect to IMDS -->
<iframe src="http://169.254.169.254/latest/meta-data/" style="display:none"></iframe>

<!-- Test: links to IMDS for crawler to discover -->
<a href="http://169.254.169.254/latest/meta-data/">System Info</a>
<a href="http://169.254.169.254/latest/meta-data/iam/security-credentials/">Credentials</a>
<a href="http://169.254.169.254/latest/user-data">User Data</a>
<a href="http://[::ffff:169.254.169.254]/latest/meta-data/">IPv6 System Info</a>

<!-- Test: JavaScript fetch to IMDS -->
<script>
fetch("http://169.254.169.254/latest/meta-data/")
  .then(r => r.text())
  .then(t => { document.getElementById("meta").innerText = t; })
  .catch(e => { document.getElementById("meta").innerText = "Error: " + e; });
</script>
<div id="meta">Loading metadata...</div>

<!-- Test: img tag SSRF to IMDS -->
<img src="http://169.254.169.254/latest/meta-data/ami-id" style="display:none">

<!-- Test: form action to IMDS -->
<form action="http://169.254.169.254/latest/meta-data/" method="GET">
<input type="hidden" name="test" value="1">
</form>
</body>
</html>
