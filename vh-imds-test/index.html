<!DOCTYPE html>
<html>
<head><title>VH Test App - Login</title></head>
<body>
<h1>VH Test Application</h1>
<div id="login-section">
<form id="login-form" method="POST" action="/vh-imds-test/login">
  <label>Username: <input type="text" name="username" id="username"></label><br>
  <label>Password: <input type="password" name="password" id="password"></label><br>
  <button type="submit">Log In</button>
</form>
</div>
<div id="dashboard" style="display:none">
<h2>Dashboard</h2>
<p>Welcome! Session active.</p>
<a href="/vh-imds-test/api/config">API Config</a>
<a href="/vh-imds-test/api/status">Status</a>
<a href="/vh-imds-test/profile">Profile</a>
</div>
<script>
document.getElementById("login-form").addEventListener("submit", function(e) {
  e.preventDefault();
  var u = document.getElementById("username").value;
  var p = document.getElementById("password").value;
  if (u === "vh-testuser" && p === "vh-testpass-2026") {
    document.getElementById("login-section").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.title = "VH Test App - Dashboard";
  } else {
    alert("Invalid credentials");
  }
});
</script>
</body>
</html>
