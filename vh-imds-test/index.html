<!DOCTYPE html>
<html>
<head><title>VH Test App - Login</title></head>
<body>
<h1>VH Test Application</h1>
<form id="login-form" method="POST" action="/vh-imds-test/login">
  <label>Username: <input type="text" name="username" id="username"></label><br>
  <label>Password: <input type="password" name="password" id="password"></label><br>
  <button type="submit">Log In</button>
</form>
<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var u = document.getElementById('username').value;
  var p = document.getElementById('password').value;
  if (u === 'vh-testuser' && p === 'vh-testpass-2026') {
    document.body.innerHTML = '<h1>Welcome, ' + u + '! You are logged in.</h1><p>Session active.</p>';
  } else {
    alert('Invalid credentials');
  }
});
</script>
</body>
</html>
