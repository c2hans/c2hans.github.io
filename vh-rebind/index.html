<!DOCTYPE html>
<html>
<head><title>VH Rebind Test App - Login</title></head>
<body>
<div id="app">
  <div id="login-view">
    <h1>Application Login</h1>
    <form id="loginForm">
      <label for="username">Username:</label><br>
      <input type="text" name="username" id="username"><br><br>
      <label for="password">Password:</label><br>
      <input type="password" name="password" id="password"><br><br>
      <button type="submit">Sign In</button>
    </form>
    <p id="error" style="color:red;display:none">Invalid credentials</p>
  </div>
  <div id="dashboard-view" style="display:none">
    <h1>Dashboard</h1>
    <p>Welcome, <span id="welcome-user"></span>!</p>
    <p>You are logged in.</p>
    <nav>
      <a href="/vh-rebind/profile">Profile</a> |
      <a href="/vh-rebind/settings">Settings</a> |
      <a href="#" id="logout-btn">Logout</a>
    </nav>
  </div>
</div>
<script>
(function() {
  var loginForm = document.getElementById("loginForm");
  var loginView = document.getElementById("login-view");
  var dashView = document.getElementById("dashboard-view");
  var welcomeUser = document.getElementById("welcome-user");

  // Check if already logged in
  var token = localStorage.getItem("session_token");
  var user = localStorage.getItem("session_user");
  if (token && user) {
    loginView.style.display = "none";
    dashView.style.display = "block";
    welcomeUser.textContent = user;
    document.cookie = "session=" + token + "; path=/; SameSite=Lax";
  }

  loginForm.addEventListener("submit", function(e) {
    e.preventDefault();
    var u = document.getElementById("username").value;
    var p = document.getElementById("password").value;
    if (u && p) {
      var tok = btoa(u + ":" + Date.now());
      localStorage.setItem("session_token", tok);
      localStorage.setItem("session_user", u);
      document.cookie = "session=" + tok + "; path=/; SameSite=Lax";
      loginView.style.display = "none";
      dashView.style.display = "block";
      welcomeUser.textContent = u;
    } else {
      document.getElementById("error").style.display = "block";
    }
  });

  document.getElementById("logout-btn").addEventListener("click", function(e) {
    e.preventDefault();
    localStorage.removeItem("session_token");
    localStorage.removeItem("session_user");
    document.cookie = "session=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
    loginView.style.display = "block";
    dashView.style.display = "none";
  });
})();
</script>
</body>
</html>
